:root[data-theme="light"] {
  color-scheme: light;
}

:root[data-theme="dark"] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html > body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: var(--visualize-paint-gutter, 0px);
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

:root:not([data-app-block-surface], [data-visualize-standalone]) > body {
  padding: 12px;
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive > .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align="right"]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align="center"]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

#widget > :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

/* The shared runtime owns data-tooltip; suppress AppBlock's pseudo-tooltip. */
main [data-tooltip]::after {
  content: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

hr {
  width: 100%;
  height: 1px;
  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {
  display: flex;
  height: 8px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 8px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {
  border-radius: var(--radius-full);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls > .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls > .form-label > :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,
.nav-link {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover,
.nav-link:not(:disabled):not([aria-disabled="true"]):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.nav-pills .nav-link {
  min-width: 0;
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.nav-justified .nav-link {
  flex: 1 1 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

.nav-pills .nav-link.active {
  color: var(--foreground);
  background: var(--muted);
}

.btn:disabled,
.nav-link:disabled,
.nav-link[aria-disabled="true"] {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type="file"] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type="file"]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type="file"]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type="color"] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type="color"]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type="color"]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: var(--corner-shape);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type="checkbox"]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: "";
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type="radio"] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type="radio"]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: "";
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed="true"],
  [aria-selected="true"],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed="true"], [aria-selected="true"], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type="file"]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type="color"] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type="date"],
    [type="datetime-local"],
    [type="month"],
    [type="time"],
    [type="week"]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: "";
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget > svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html>body{padding:0}</style>
<style>body { max-width: 1100px; margin: 0 auto; padding: 24px; box-sizing: border-box; } @media (max-width: 500px) { body { padding: 12px; } }</style>
</head>
<body>
<div id="collision-steps-demo" dir="rtl">
  <div class="viz-controls">
    <label class="form-label">מספר כדורים
      <select class="form-select" data-count aria-label="מספר כדורים">
        <option>10</option><option>20</option><option>50</option><option selected>100</option><option>200</option><option>500</option>
      </select>
    </label>
    <label class="form-label">שיטת הבדיקה
      <select class="form-select" data-method aria-label="שיטת בדיקת התנגשויות">
        <option value="all">כל זוג כדורים</option><option value="grid">חלוקה לתאים ושכנים</option>
      </select>
    </label>
    <label class="form-label">עדכונים לשנייה — יעד
      <select class="form-select" data-rate aria-label="קצב עדכון מבוקש">
        <option>30</option><option selected>60</option><option>120</option>
      </select>
    </label>
    <button class="btn" type="button" data-play>השהיה</button>
  </div>
  <div class="viz-grid">
    <div class="card viz-stat"><div>כל הזוגות האפשריים</div><div class="viz-stat-value tabular-nums" data-total>4,950</div></div>
    <div class="card viz-stat"><div>בדיקות זוגות בעדכון האחרון</div><div class="viz-stat-value tabular-nums" data-checks>4,950</div></div>
    <div class="card viz-stat"><div>זוגות במגע בעדכון האחרון</div><div class="viz-stat-value tabular-nums" data-contacts>0</div></div>
  </div>
  <div class="viz-row text-small" data-budget aria-live="polite"></div>
  <canvas data-field role="img" aria-label="כדורים בתנועה בתוך מלבן, עם החזרה מהקירות והתנגשות בכדורים אחרים. הקווים מראים את הזוגות הנבדקים עם הכדור המסומן.">הדגמה של בדיקות התנגשות בין כדורים.</canvas>
  <div class="text-small">קווים: בדיקות עם הכדור המסומן · המונים סופרים בדיקות זוגות בלבד</div>
  <div class="sr-only" data-summary aria-live="polite"></div>
</div>
<style>
  #collision-steps-demo { display: grid; gap: 12px; }
  #collision-steps-demo canvas { display: block; width: 100%; aspect-ratio: 2; }
</style>
<script>
(() => {
  const root = document.getElementById('collision-steps-demo');
  const countInput = root.querySelector('[data-count]');
  const methodInput = root.querySelector('[data-method]');
  const rateInput = root.querySelector('[data-rate]');
  const play = root.querySelector('[data-play]');
  const canvas = root.querySelector('[data-field]');
  const ctx = canvas.getContext('2d');
  const format = new Intl.NumberFormat('en-US');
  const width = 720, height = 360, radius = 5, cellSize = 32;
  let balls = [], links = [], checks = 0, contacts = 0;
  let running = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  let prev = null, accumulator = 0, lastDisplay = 0;
  let colors = {}, dpr = 1;
  function updateColors() {
    const css = getComputedStyle(root);
    colors = { ball: css.getPropertyValue('--viz-series-1').trim(), selected: css.getPropertyValue('--viz-series-2').trim(), border: css.getPropertyValue('--border').trim(), fg: css.getPropertyValue('--foreground').trim() };
  }
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    const cw = canvas.getBoundingClientRect().width;
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(cw * dpr / 2);
    draw();
  }
  function reset() {
    let seed = 48271;
    const random = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    balls = [];
    for (let i = 0; i < Number(countInput.value); i++) {
      let x, y, attempts = 0;
      do { x = radius + random() * (width - 2 * radius); y = radius + random() * (height - 2 * radius); attempts++; }
      while (attempts < 5000 && balls.some(b => (b.x - x) ** 2 + (b.y - y) ** 2 < (2 * radius + 1) ** 2));
      const angle = random() * 2 * Math.PI, speed = 40 + random() * 25;
      balls.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed });
    }
    accumulator = 0;
    evaluate(false);
    updateDisplay(true);
    draw();
  }
  function visitPairs(visitor) {
    if (methodInput.value === 'all') {
      for (let i = 0; i < balls.length; i++) for (let j = i + 1; j < balls.length; j++) visitor(i, j);
      return;
    }
    const cols = Math.ceil(width / cellSize), rows = Math.ceil(height / cellSize);
    const cells = Array.from({length: cols * rows}, () => []);
    balls.forEach((b, i) => cells[Math.floor(b.y / cellSize) * cols + Math.floor(b.x / cellSize)].push(i));
    balls.forEach((b, i) => {
      const cx = Math.floor(b.x / cellSize), cy = Math.floor(b.y / cellSize);
      for (let y = Math.max(0, cy - 1); y <= Math.min(rows - 1, cy + 1); y++) {
        for (let x = Math.max(0, cx - 1); x <= Math.min(cols - 1, cx + 1); x++) {
          for (const j of cells[y * cols + x]) if (j > i) visitor(i, j);
        }
      }
    });
  }
  function evaluate(resolve) {
    checks = 0; contacts = 0; links = [];
    const deltas = resolve ? balls.map(() => ({x: 0, y: 0, vx: 0, vy: 0})) : null;
    visitPairs((i, j) => {
      checks++;
      if (i === 0) links.push(j);
      const a = balls[i], b = balls[j], dx = b.x - a.x, dy = b.y - a.y;
      const ds = dx * dx + dy * dy;
      if (ds > 4 * radius * radius) return;
      contacts++;
      if (!resolve) return;
      const distance = Math.sqrt(ds), nx = distance > 0 ? dx / distance : 1, ny = distance > 0 ? dy / distance : 0;
      const overlap = (2 * radius - distance) / 2;
      deltas[i].x -= nx * overlap; deltas[i].y -= ny * overlap;
      deltas[j].x += nx * overlap; deltas[j].y += ny * overlap;
      const speedAlongNormal = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (speedAlongNormal < 0) {
        deltas[i].vx += speedAlongNormal * nx; deltas[i].vy += speedAlongNormal * ny;
        deltas[j].vx -= speedAlongNormal * nx; deltas[j].vy -= speedAlongNormal * ny;
      }
    });
    if (resolve) balls.forEach((b, i) => {
      const d = deltas[i];
      b.x += d.x; b.y += d.y; b.vx += d.vx; b.vy += d.vy;
      reflect(b);
    });
  }
  function reflect(b) {
    if (b.x < radius) { b.x = radius; b.vx = Math.abs(b.vx); }
    if (b.x > width - radius) { b.x = width - radius; b.vx = -Math.abs(b.vx); }
    if (b.y < radius) { b.y = radius; b.vy = Math.abs(b.vy); }
    if (b.y > height - radius) { b.y = height - radius; b.vy = -Math.abs(b.vy); }
  }
  function step(dt) {
    balls.forEach(b => { b.x += b.vx * dt; b.y += b.vy * dt; reflect(b); });
    evaluate(true);
  }
  function updateDisplay(announce) {
    const n = balls.length, total = n * (n - 1) / 2, hz = Number(rateInput.value);
    root.querySelector('[data-total]').textContent = format.format(total);
    root.querySelector('[data-checks]').textContent = format.format(checks);
    root.querySelector('[data-contacts]').textContent = format.format(contacts);
    root.querySelector('[data-budget]').textContent = 'תקציב לעדכון: ' + (1000 / hz).toFixed(2) + ' מילישניות · בשיטת כל הזוגות: ' + format.format(total * hz) + ' בדיקות לשנייה בקצב היעד';
    if (announce) root.querySelector('[data-summary]').textContent = n + ' כדורים. ' + methodInput.selectedOptions[0].textContent + '. ' + format.format(checks) + ' בדיקות זוגות.';
    play.textContent = running ? 'השהיה' : 'הפעלה';
  }
  function draw() {
    if (!canvas.width || !balls.length) return;
    updateColors();
    ctx.setTransform(canvas.width / width, 0, 0, canvas.height / height, 0, 0);
    ctx.clearRect(0, 0, width, height);
    ctx.lineWidth = 1;
    if (methodInput.value === 'grid') {
      ctx.strokeStyle = colors.border;
      ctx.beginPath();
      for (let x = cellSize; x < width; x += cellSize) { ctx.moveTo(x, 0); ctx.lineTo(x, height); }
      for (let y = cellSize; y < height; y += cellSize) { ctx.moveTo(0, y); ctx.lineTo(width, y); }
      ctx.stroke();
    }
    ctx.strokeStyle = colors.selected;
    ctx.globalAlpha = 0.23;
    ctx.beginPath();
    for (const j of links) { ctx.moveTo(balls[0].x, balls[0].y); ctx.lineTo(balls[j].x, balls[j].y); }
    ctx.stroke(); ctx.globalAlpha = 1;
    balls.forEach((b, i) => {
      ctx.fillStyle = i === 0 ? colors.selected : colors.ball;
      ctx.beginPath(); ctx.arc(b.x, b.y, radius, 0, Math.PI * 2); ctx.fill();
      if (i === 0) { ctx.strokeStyle = colors.selected; ctx.beginPath(); ctx.arc(b.x, b.y, radius + 3, 0, Math.PI * 2); ctx.stroke(); }
    });
    ctx.strokeStyle = colors.fg;
    ctx.strokeRect(0.5, 0.5, width - 1, height - 1);
  }
  function frame(now) {
    if (!root.isConnected) return;
    if (prev === null) prev = now;
    if (running && !document.hidden) {
      accumulator += Math.min((now - prev) / 1000, 0.1);
      const dt = 1 / Number(rateInput.value);
      let ticks = 0;
      while (accumulator >= dt && ticks < 12) { step(dt); accumulator -= dt; ticks++; }
    }
    prev = now;
    if (now - lastDisplay > 150) { updateDisplay(false); lastDisplay = now; }
    draw(); requestAnimationFrame(frame);
  }
  countInput.addEventListener('change', reset);
  methodInput.addEventListener('change', () => { evaluate(false); updateDisplay(true); draw(); });
  rateInput.addEventListener('change', () => { accumulator = 0; updateDisplay(true); });
  play.addEventListener('click', () => { running = !running; prev = null; accumulator = 0; updateDisplay(true); });
  new ResizeObserver(resize).observe(canvas);
  reset(); resize(); requestAnimationFrame(frame);
})();
</script>








</body>
